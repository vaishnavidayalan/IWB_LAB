<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        /* ===== PAGE BACKGROUND ===== */

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f3e8ff,
                #e9d5ff,
                #ddd6fe,
                #d8b4fe,
                #c084fc
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* ===== MAIN CARD ===== */

        .registration-card {

            width: 100%;
            max-width: 700px;

            background: rgba(255, 255, 255, 0.65);

            backdrop-filter: blur(15px);

            border: 1px solid white;

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(88, 28, 135, 0.20);

            overflow: hidden;
        }


        /* ===== HEADER ===== */

        .form-header {

            background: linear-gradient(
                135deg,
                #7e22ce,
                #9333ea,
                #a855f7
            );

            color: white;

            text-align: center;

            padding: 30px;
        }

        .form-header i {

            font-size: 45px;

        }

        .form-header h2 {

            font-weight: bold;

            margin-top: 10px;

        }

        .form-header p {

            margin: 0;

            opacity: 0.9;

        }


        /* ===== FORM BODY ===== */

        .form-body {

            padding: 35px;

        }


        /* ===== LABEL ===== */

        .form-label {

            color: #581c87;

            font-weight: 600;

        }


        /* ===== INPUT ===== */

        .form-control,
        .form-select {

            padding: 12px;

            border-radius: 10px;

            border: 1px solid #d8b4fe;

            background: rgba(255,255,255,0.85);

        }

        .form-control:focus,
        .form-select:focus {

            border-color: #9333ea;

            box-shadow:
                0 0 0 0.2rem
                rgba(147,51,234,0.15);

        }


        /* ===== INPUT ICON ===== */

        .input-group-text {

            background: #f3e8ff;

            border-color: #d8b4fe;

            color: #7e22ce;

        }


        /* ===== BUTTON ===== */

        .register-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #7e22ce,
                #9333ea
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            transition: 0.3s;

        }

        .register-btn:hover {

            background: linear-gradient(
                135deg,
                #6b21a8,
                #7e22ce
            );

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(126,34,206,0.3);

        }


        /* ===== ERROR MESSAGE ===== */

        .error {

            color: #dc2626;

            font-size: 13px;

        }


        /* ===== SUCCESS MESSAGE ===== */

        #successMessage {

            display: none;

            text-align: center;

            color: #15803d;

            background: #dcfce7;

            padding: 12px;

            border-radius: 10px;

            margin-top: 20px;

        }


        /* ===== PASSWORD STRENGTH ===== */

        .strength-bar {

            height: 5px;

            width: 0%;

            margin-top: 7px;

            border-radius: 10px;

            transition: 0.3s;

        }


        /* ===== MOBILE ===== */

        @media(max-width:576px) {

            .form-body {

                padding: 25px 20px;

            }

            .form-header {

                padding: 25px 15px;

            }

        }

    </style>

</head>


<body>


<!-- ===== REGISTRATION CARD ===== -->

<div class="registration-card">


    <!-- HEADER -->

    <div class="form-header">

        <i class="bi bi-person-plus-fill"></i>

        <h2>Create an Account</h2>

        <p>Register your account to get started</p>

    </div>


    <!-- FORM -->

    <div class="form-body">

        <form id="registrationForm"
              onsubmit="return validateForm()">


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your full name">

                </div>

                <span id="nameError"
                      class="error">
                </span>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email">

                </div>

                <span id="emailError"
                      class="error">
                </span>

            </div>


            <!-- PHONE -->

            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-telephone"></i>
                    </span>

                    <input
                        type="text"
                        id="phone"
                        class="form-control"
                        placeholder="Enter 10 digit phone number">

                </div>

                <span id="phoneError"
                      class="error">
                </span>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password">

                    <button
                        type="button"
                        class="btn btn-light"
                        onclick="togglePassword()">

                        <i class="bi bi-eye"
                           id="eyeIcon">
                        </i>

                    </button>

                </div>


                <div
                    id="strengthBar"
                    class="strength-bar">
                </div>

                <small id="strengthText"></small>

                <span
                    id="passwordError"
                    class="error d-block">
                </span>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-shield-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password">

                </div>

                <span
                    id="confirmError"
                    class="error">
                </span>

            </div>


            <!-- TERMS -->

            <div class="form-check mb-4">

                <input
                    type="checkbox"
                    id="terms"
                    class="form-check-input">

                <label
                    for="terms"
                    class="form-check-label">

                    I agree to the
                    <strong>Terms & Conditions</strong>

                </label>

                <span
                    id="termsError"
                    class="error d-block">
                </span>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn">

                <i class="bi bi-person-check-fill"></i>

                Register Now

            </button>


            <!-- SUCCESS -->

            <div id="successMessage">

                <i class="bi bi-check-circle-fill"></i>

                Registration Successful!

            </div>


        </form>

    </div>

</div>



<!-- ===== JAVASCRIPT ===== -->

<script>


/* ================= VALIDATION ================= */

function validateForm() {

    let valid = true;


    let name =
        document.getElementById("name").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;

    let terms =
        document.getElementById("terms").checked;


    /* Clear errors */

    document.querySelectorAll(".error")
        .forEach(function(error) {

            error.innerText = "";

        });


    document.getElementById("successMessage")
        .style.display = "none";


    /* NAME */

    if (name === "") {

        document.getElementById("nameError")
            .innerText =
            "Please enter your full name.";

        valid = false;

    }

    else if (!/^[A-Za-z ]+$/.test(name)) {

        document.getElementById("nameError")
            .innerText =
            "Name should contain only letters.";

        valid = false;

    }


    /* EMAIL */

    let emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (email === "") {

        document.getElementById("emailError")
            .innerText =
            "Please enter your email.";

        valid = false;

    }

    else if (!emailPattern.test(email)) {

        document.getElementById("emailError")
            .innerText =
            "Please enter a valid email address.";

        valid = false;

    }


    /* PHONE */

    if (!/^[0-9]{10}$/.test(phone)) {

        document.getElementById("phoneError")
            .innerText =
            "Phone number must contain 10 digits.";

        valid = false;

    }


    /* PASSWORD */

    if (password.length < 8) {

        document.getElementById("passwordError")
            .innerText =
            "Password must contain at least 8 characters.";

        valid = false;

    }


    /* CONFIRM PASSWORD */

    if (password !== confirmPassword) {

        document.getElementById("confirmError")
            .innerText =
            "Passwords do not match.";

        valid = false;

    }


    /* TERMS */

    if (!terms) {

        document.getElementById("termsError")
            .innerText =
            "Please accept the Terms & Conditions.";

        valid = false;

    }


    /* SUCCESS */

    if (valid) {

        document.getElementById("successMessage")
            .style.display = "block";

        document.getElementById("registrationForm")
            .reset();

        document.getElementById("strengthBar")
            .style.width = "0%";

        document.getElementById("strengthText")
            .innerText = "";

    }


    return false;
}


/* ================= PASSWORD VISIBILITY ================= */

function togglePassword() {

    let password =
        document.getElementById("password");

    let icon =
        document.getElementById("eyeIcon");


    if (password.type === "password") {

        password.type = "text";

        icon.className =
            "bi bi-eye-slash";

    }

    else {

        password.type = "password";

        icon.className =
            "bi bi-eye";

    }

}


/* ================= PASSWORD STRENGTH ================= */

document.getElementById("password")
    .addEventListener("input", function() {

        let password = this.value;

        let bar =
            document.getElementById("strengthBar");

        let text =
            document.getElementById("strengthText");


        let strength = 0;


        if (password.length >= 8)
            strength++;

        if (/[A-Z]/.test(password))
            strength++;

        if (/[0-9]/.test(password))
            strength++;

        if (/[^A-Za-z0-9]/.test(password))
            strength++;


        if (password.length === 0) {

            bar.style.width = "0%";

            text.innerText = "";

        }

        else if (strength <= 1) {

            bar.style.width = "25%";

            bar.style.background = "#ef4444";

            text.innerText = "Weak";

            text.style.color = "#ef4444";

        }

        else if (strength === 2) {

            bar.style.width = "50%";

            bar.style.background = "#f59e0b";

            text.innerText = "Medium";

            text.style.color = "#f59e0b";

        }

        else if (strength === 3) {

            bar.style.width = "75%";

            bar.style.background = "#22c55e";

            text.innerText = "Good";

            text.style.color = "#16a34a";

        }

        else {

            bar.style.width = "100%";

            bar.style.background = "#15803d";

            text.innerText = "Strong";

            text.style.color = "#15803d";

        }

    });

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
